services:
  - type: web
    name: void-md
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: BOT_NAME
        value: Void MD
      - key: PORT
        value: 3000
      - key: SESSION_ID
        sync: false
        # ^ Paste the VOID-MD:... string from the session generator here
        # in the Render dashboard (Environment tab) — do not commit it to
        # git. With SESSION_ID set, the bot skips the interactive pairing
        # menu and logs straight in.
      - key: WOLVAREX_API_KEY
        sync: false
        # ^ set in the Render dashboard; never commit it.
    healthCheckPath: /health
