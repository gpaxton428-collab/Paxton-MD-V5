# docker compose up -d --build
# Put your secrets in a local .env file (copy .env.example) — it is read by
# compose and is never baked into the image.
services:
  void-md:
    build: .
    image: void-md:v2
    container_name: void-md
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "3000"
    ports:
      - "3000:3000"
    volumes:
      - void-session:/app/session
      - void-data:/app/data
    init: true               # signal forwarding even without tini
    stop_grace_period: 15s   # time for the bot to save state on SIGTERM
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    security_opt:
      - no-new-privileges:true
volumes:
  void-session:
  void-data:
